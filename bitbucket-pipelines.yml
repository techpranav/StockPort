image: atlassian/default-image:3

pipelines:
  branches:
    "**":
      - step:
          name: Full Mirror to GitHub
          script:
            - set -e

            # Git config
            - git config --global user.email "mirror@bot.com"
            - git config --global user.name "Mirror Bot"

            # 🔐 Authenticated mirror clone using API token
            - git clone --mirror https://$BITBUCKET_USERNAME:$BITBUCKET_API_TOKEN@bitbucket.org/$BITBUCKET_REPO_FULL_NAME.git repo.git

            - cd repo.git

            # Add GitHub remote
            - git remote add github https://x-token-auth:$GITHUB_TOKEN@github.com/$GITHUB_USERNAME/$BITBUCKET_REPO_SLUG.git

            # 🔁 Retry mirror push
            - |
              for i in 1 2 3; do
                echo "Attempt $i: Mirroring to GitHub..."
                if git push github --mirror; then
                  echo "✅ Mirror successful"
                  exit 0
                fi
                echo "Retrying in 5 seconds..."
                sleep 5
              done

              echo "❌ Mirror failed after 3 attempts"
              exit 1